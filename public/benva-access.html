tabindex="-1"></main><footer><div class="container"><span>© 2026 Benue Virtual Academy</span><nav aria-label="Footer navigation"><a href="benva-information.html?page=privacy">Privacy</a><a href="benva-information.html?page=support">Help & support</a><a href="benva-preview.html#home">Back to homepage</a></nav></div></footer><div id="notice" class="toast" role="status" aria-live="polite" hidden></div><script>const main=document.querySelector('#main');
const labels=['Guardian account','Email verification','Learner profile','Programme choice','Requirements','Enrolment review','Orientation'];
const programmeNames={'full':'Full Virtual School','after':'After-School Learning','exam':'Examination Preparation'};
let draft={step:1,level:'Primary 4',programme:'full'};
try{const saved=JSON.parse(sessionStorage.getItem('benva-design-journey'));if(saved&&Number.isInteger(saved.step)&&saved.step>=1&&saved.step<=7){draft.step=saved.step;if(['Primary 4','JSS 2','SS 2'].includes(saved.level))draft.level=saved.level;if(programmeNames[saved.programme])draft.programme=saved.programme;}}catch{}
function persist(){try{sessionStorage.setItem('benva-design-journey',JSON.stringify(draft));}catch{}}
function notify(text){const box=document.querySelector('#notice');box.textContent=text;box.hidden=false;setTimeout(()=>box.hidden=true,7000);}
const field=(label,value,type='text',full=false)=>'<div class="field '+(full?'full':'')+'"><label>'+label+'<input type="'+type+'" value="'+value+'" readonly autocomplete="off"></label></div>';
function row(label,value){return '<div><dt>'+label+'</dt><dd>'+value+'</dd></div>';}
function journey(){const items=labels.map((x,i)=>'<li class="'+(i+1===draft.step?'current':i+1<draft.step?'done':'')+'" '+(i+1===draft.step?'aria-current="step"':'')+'><span class="number">'+(i+1<draft.step?'✓':i+1)+'</span><span class="label">'+x+'</span></li>').join('');return '<aside class="journey-panel"><h2>Your registration journey</h2><p>One guardian account. A clear pathway for every linked learner.</p><ol class="journey-list">'+items+'</ol><p class="side-note">Registration creates an account. Enrolment places a learner in a programme after the applicable admission steps.</p></aside>';}
function stepContent(){switch(draft.step){
case 1:return '<span class="sample-label">Sample guardian details</span><h2>Create your guardian account</h2><p>Parents and guardians register first, then add and manage their learners.</p><div class="fields">'+field('Full name','Example Guardian')+field('Email address','guardian@example.com','email')+field('Phone number','+234 ••• ••• ••••')+'<div class="field"><label for="sample-password">Password</label><div class="password-wrap"><input id="sample-password" type="password" value="SampleOnly123!" readonly autocomplete="off"><button type="button" data-show-password aria-label="Show sample password">Show</button></div><small>Password rules will be displayed during account creation.</small></div></div><div class="helper-box"><strong>Guardian-led registration</strong><p>Learner accounts are linked through enrolment. Staff accounts are created by authorised invitation.</p></div>';
case 2:return '<div class="verify-symbol" aria-hidden="true">✉</div><h2>Verify your email address</h2><p>The live registration journey will send a confirmation link to the guardian’s email before account access is granted.</p><div class="review-list">'+row('Sample email','guardian@example.com')+'</div><div class="helper-box amber"><strong>Email verification preview</strong><p>No email is sent here. Continue to explore the screen that follows a successful confirmation.</p></div><button class="button small" data-notice="In the live journey, you will be able to request a new confirmation email.">Resend email preview</button>';
case 3:return '<span class="sample-label">Sample learner details</span><h2>Add your learner</h2><p>Create a learner profile linked to the guardian account. You can add more than one learner.</p><div class="fields">'+field('Learner name','Example Learner')+'<div class="field"><label for="sample-level">Current class</label><select id="sample-level">'+['Primary 4','JSS 2','SS 2'].map(x=>'<option '+(x===draft.level?'selected':'')+'>'+x+'</option>').join('')+'</select></div>'+field('School information','Example school record', 'text',true)+'</div><div class="helper-box"><strong>Placement and consent</strong><p>The live journey will explain required school information, guardian consent and any placement review before admission.</p></div>';
case 4:return '<h2>Choose a learning programme</h2><p>Select the type of support that matches the learner’s goals and current school arrangement.</p><div class="choice-grid">'+Object.entries(programmeNames).map(([k,v])=>'<label class="choice"><input type="radio" name="programme" value="'+k+'" '+(draft.programme===k?'checked':'')+'><div><strong>'+v+'</strong><span>'+({full:'A structured virtual learning timetable with teaching and academic support.',after:'Extra explanation, practice and revision alongside physical schooling.',exam:'Focused revision, practice and guidance for relevant examinations.'}[k])+'</span></div></label>').join('')+'</div><a class="text-link" href="benva-information.html?page=programmes">Read programme details</a>';
case 5:return '<h2>Review participation requirements</h2><p>Families should understand the programme before committing to enrolment.</p><dl class="review-list">'+row('Programme',programmeNames[draft.programme])+row('Current class',draft.level)+row('Timetable','To be announced')+row('Fees and payment terms','To be announced')+row('Class and subject availability','To be confirmed at enrolment')+'</dl><ul class="clean-list"><li>Plan a suitable device, connection and learning space.</li><li>Understand guardian involvement and safeguarding arrangements.</li><li>Review the programme conditions and any placement requirements.</li></ul><div class="helper-box amber"><strong>Review before enrolment</strong><p>The live journey will present confirmed requirements and consent information. This preview does not collect consent or payments.</p></div>';
case 6:return '<h2>Review the learner’s enrolment</h2><p>In the live journey, the guardian reviews the information and completes the applicable admission steps.</p><dl class="review-list">'+row('Guardian','Example Guardian')+row('Learner','Example Learner')+row('Current class',draft.level)+row('Programme',programmeNames[draft.programme])+'</dl><div class="helper-box"><strong>A clear admission status</strong><p>The parent dashboard will show whether enrolment is incomplete, under review, awaiting action or confirmed.</p></div><div class="status-guide"><span class="status amber">Continue enrolment</span><span class="status">Under review</span><span class="status amber">Action required</span><span class="status green">Enrolled</span></div>';
case 7:return '<span class="sample-label">Orientation screen preview</span><h2>Prepare for the first lesson</h2><p>After admission is confirmed, learners and guardians receive the information they need to begin.</p><div class="checklist"><div><b>01</b><div><h3>Learner access</h3><p>Receive account instructions and confirm the authorised guardian link.</p></div></div><div><b>02</b><div><h3>Academy orientation</h3><p>Understand the timetable, participation rules and support channels.</p></div></div><div><b>03</b><div><h3>Learning preparation</h3><p>Check the device and connection, and gather required materials.</p></div></div><div><b>04</b><div><h3>Timetable and learning space</h3><p>Find scheduled classes, subjects and assigned activities.</p></div></div></div><div class="helper-box amber"><strong>Preview complete</strong><p>No application has been submitted and no learner has been admitted. Explore the parent dashboard design next.</p></div>';
}}
function renderRegister(){document.title='Register | Benue Virtual Academy';main.innerHTML='<div class="container"><div class="page-intro"><div class="eyebrow">Parents & guardians</div><h1>A clear beginning for every learner.</h1><p>Create your account, choose a suitable pathway and guide your learner towards a confident start.</p></div><div class="account-layout">'+journey()+'<section class="form-panel" aria-label="Registration step"><div class="step-meta"><span>Step '+draft.step+' of 7</span><span>Sample journey</span></div><div class="step-track" aria-hidden="true"><span style="width:'+draft.step/7*100+'%"></span></div><div class="step-content">'+stepContent()+'</div><div class="form-actions"><button class="button" '+(draft.step===1?'data-reset':'data-back')+'>'+(draft.step===1?'Reset preview':'Back')+'</button>'+(draft.step===7?'<a class="button green" href="benva-access.html?view=dashboard">View parent dashboard</a>':'<button class="button primary" data-next>'+(draft.step===1?'Continue':draft.step===2?'Continue preview':draft.step===6?'Preview orientation':'Continue')+'</button>')+'</div></section></div></div>';}
let activeRole='Parent/guardian';
function renderSignIn(){document.title='Sign in | Benue Virtual Academy';main.innerHTML='<div class="container sign-in-grid"><section class="sign-in-story"><img src="https://www.ukfiet.org/wp-content/uploads/2020/08/COVID_TEP-Nigeria-1.jpg" alt="A mother supporting a child learning with a laptop" width="1000" height="667"><div class="eyebrow" style="margin-top:30px">Your academy, connected</div><h1>Welcome back to learning.</h1><p>Access your learning space, follow progress and stay connected to the people supporting your educational journey.</p></section><section class="form-panel sign-in-form"><h2>Sign in to BenVA</h2><p style="margin-top:10px">Choose your account type to continue.</p><div class="role-row">'+['Parent/guardian','Learner','Teacher/staff','Administrator'].map(r=>'<button class="role-button" aria-pressed="'+(r===activeRole)+'" data-role="'+r+'">'+r+'</button>').join('')+'</div><form id="signin-preview"><div class="fields">'+field(activeRole==='Learner'?'Learner identifier':'Email address',activeRole==='Learner'?'Example learner identifier':'guardian@example.com')+field('Password','SampleOnly123!','password')+'</div><a class="text-link" href="benva-access.html?view=recovery">Forgot your password?</a><button class="button primary" type="submit">Preview sign in</button></form><div class="helper-box amber"><strong>Account page design</strong><p>This screen does not authenticate accounts. Learner access follows guardian-supported enrolment; staff and administrator access is invitation-only.</p></div><div class="signin-bottom"><span>New to BenVA?</span><a class="text-link" href="benva-access.html?view=register">Register as a guardian</a></div></section></div>';}
function renderRecovery(){document.title='Password recovery | Benue Virtual Academy';main.innerHTML='<div class="container"><div class="page-intro"><div class="eyebrow">Account recovery</div><h1>Get back to your account.</h1><p>The live recovery journey will help account holders request secure password reset instructions.</p></div><section class="form-panel" style="max-width:650px;margin-bottom:55px"><h2>Reset your password</h2><div class="fields">'+field('Account email','guardian@example.com','email',true)+'</div><button class="button primary" data-notice="Password recovery is shown as a design only. No email has been sent.">Preview reset request</button><div class="helper-box amber"><strong>Recovery preview</strong><p>No account lookup or email delivery takes place on this screen.</p></div><a class="text-link" href="benva-access.html?view=sign-in">Return to sign in</a></section></div>';}
function renderDashboard(){document.title='Parent dashboard preview | Benue Virtual Academy';main.innerHTML='<div class="container"><div class="page-intro"><div class="eyebrow">Parent dashboard · Sample account</div><h1>Welcome, Example Guardian.</h1><p>Manage linked learners, follow enrolment and prepare for the academy journey.</p></div><div class="dashboard-layout"><aside class="dash-side"><h2>My BenVA</h2><nav aria-label="Dashboard navigation"><button class="active" data-notice="You are viewing the sample account overview.">Overview</button><a href="benva-access.html?view=register">Learners & enrolment</a><button data-notice="Learning schedules appear after a learner’s enrolment is confirmed.">Timetable</button><button data-notice="Assignments, feedback and progress appear once learning begins.">Learning progress</button><a href="benva-information.html?page=support">Help & support</a></nav></aside><div class="dash-main"><section class="dash-welcome"><h2>Every learner. One connected account.</h2><p>Add a learner, choose a suitable programme and return to enrolment when you are ready.</p><a class="button" href="benva-access.html?view=register">Add a learner preview</a></section><div class="dash-grid"><section class="dash-card"><div class="learner-avatar" aria-hidden="true">EL</div><h3>Example Learner</h3><span class="status amber">Continue enrolment</span><p>'+draft.level+' · '+programmeNames[draft.programme]+'</p><p>Review the programme and complete the remaining enrolment steps.</p><a class="button primary small" href="benva-access.html?view=register">Continue enrolment</a></section><section class="dash-card"><div class="learner-avatar" aria-hidden="true">SL</div><h3>Second sample learner</h3><span class="status">Under review · Sample</span><p>JSS 2 · After-School Learning</p><p>This card illustrates how a submitted enrolment would appear while awaiting a decision.</p><button class="button small" data-notice="Sample status: under review. No actual application has been submitted.">View status preview</button></section><section class="dash-card wide"><h2 style="font-size:1.3rem">Understand enrolment progress</h2><ul class="timeline"><li>Continue enrolment<span>Some information or steps remain incomplete.</span></li><li>Under review<span>The academy is reviewing the submitted enrolment.</span></li><li>Action required<span>The guardian needs to provide information or complete a stated step.</span></li><li>Enrolled<span>Admission is confirmed and onboarding instructions are available.</span></li></ul></section></div></div></div></div>';}
const view=new URLSearchParams(location.search).get('view')||'register';
function focusStep(){const heading=document.querySelector('.step-content h2');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});heading.scrollIntoView({block:'nearest',behavior:'auto'});}}
document.addEventListener('click',e=>{const next=e.target.closest('[data-next]'),back=e.target.closest('[data-back]'),reset=e.target.closest('[data-reset]'),role=e.target.closest('[data-role]'),show=e.target.closest('[data-show-password]'),note=e.target.closest('[data-notice]');if(next){draft.step=Math.min(7,draft.step+1);persist();renderRegister();focusStep();}if(back){draft.step=Math.max(1,draft.step-1);persist();renderRegister();focusStep();}if(reset){draft={step:1,level:'Primary 4',programme:'full'};persist();renderRegister();notify('Sample journey reset.');}if(role){activeRole=role.dataset.role;renderSignIn();}if(show){const input=document.querySelector('#sample-password');input.type=input.type==='password'?'text':'password';show.textContent=input.type==='password'?'Show':'Hide';show.setAttribute('aria-label',input.type==='password'?'Show sample password':'Hide sample password');}if(note)notify(note.dataset.notice);});
document.addEventListener('change',e=>{if(e.target.id==='sample-level'){draft.level=e.target.value;persist();}if(e.target.name==='programme'){draft.programme=e.target.value;persist();}});
document.addEventListener('submit',e=>{if(e.target.id==='signin-preview'){e.preventDefault();if(activeRole==='Parent/guardian')location.href='benva-access.html?view=dashboard';else notify('This '+activeRole.toLowerCase()+' sign-in is a page design. Account access is not active.');}});
if(view==='sign-in')renderSignIn();else if(view==='dashboard')renderDashboard();else if(view==='recovery')renderRecovery();else renderRegister();
</script></body></html>
